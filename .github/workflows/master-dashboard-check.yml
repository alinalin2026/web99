name: Web99 production check

on:
  push:
    branches: [master-dashboard]
    paths:
      - 'dashboard/**'
      - 'ops/**'
      - 'ops-console/**'
      - 'assets/img/sarah*.svg'
      - '.github/workflows/master-dashboard-check.yml'
  workflow_dispatch:

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Typecheck
        working-directory: dashboard
        run: npm run typecheck

      - name: Unit tests
        working-directory: dashboard
        run: npm test

      - name: Production build
        working-directory: dashboard
        run: npm run build

      - name: Shell syntax
        run: |
          bash -n ops/*.sh
          bash -n ops/web99-ops-tool
