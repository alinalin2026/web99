<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Sarah, the Web99 assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#4429c7"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e1ff"/>
    </linearGradient>
    <clipPath id="round"><circle cx="48" cy="48" r="48"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <circle cx="48" cy="48" r="48" fill="url(#bg)"/>
    <circle cx="73" cy="17" r="24" fill="#a897ff" opacity=".28"/>
    <circle cx="18" cy="77" r="30" fill="#2d1b8f" opacity=".16"/>

    <!-- shoulders and neck -->
    <path d="M10 98c1.8-20.7 17.1-31.2 38-31.2S84.2 77.3 86 98z" fill="url(#shirt)"/>
    <path d="M40 61.5h16v11.2c-2.6 3.1-5.3 4.7-8 4.7s-5.4-1.6-8-4.7z" fill="#e9bba4"/>

    <!-- hair behind face -->
    <path d="M25 42.5c0-15.2 9.5-25.5 23-25.5s23 10.3 23 25.5c0 8.8-1.2 17.4-4.2 24.7-2.3-5.6-4.2-9.7-6.8-12.5H36c-2.6 2.8-4.5 6.9-6.8 12.5C26.2 59.9 25 51.3 25 42.5z" fill="#251750"/>

    <!-- ears -->
    <ellipse cx="30.6" cy="46" rx="4.2" ry="6" fill="#efc7b3"/>
    <ellipse cx="65.4" cy="46" rx="4.2" ry="6" fill="#efc7b3"/>

    <!-- face -->
    <path d="M31.2 39.5c0-11 7.4-18.9 16.8-18.9s16.8 7.9 16.8 18.9v9.2c0 11.8-7.5 20-16.8 20s-16.8-8.2-16.8-20z" fill="#f5d7c6"/>

    <!-- hairline -->
    <path d="M29.2 40.8C28.6 26.9 36.7 18.2 48 18.2c12 0 20.2 9.5 18.8 23.2-2.7-6.5-7.2-10.2-13.9-11.7.4 2.2-.3 4.2-2 5.9-4.5-4.4-10.4-5.6-16.7-3.5-2.5 1.8-4.1 4.8-5 8.7z" fill="#2d1b63"/>
    <path d="M29.7 40.2c1.4-8.2 6.4-13.8 13.8-15.4" stroke="#49327e" stroke-width="2" stroke-linecap="round" fill="none" opacity=".65"/>

    <!-- brows -->
    <path d="M36.7 41.2c2-1.5 4.7-1.7 6.9-.6M52.4 40.6c2.2-1.1 4.9-.9 6.9.6" stroke="#39245e" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- eyes -->
    <ellipse cx="40.3" cy="46.1" rx="2.45" ry="2.7" fill="#332052"/>
    <ellipse cx="55.7" cy="46.1" rx="2.45" ry="2.7" fill="#332052"/>
    <circle cx="41.1" cy="45.2" r=".8" fill="#fff"/>
    <circle cx="56.5" cy="45.2" r=".8" fill="#fff"/>

    <!-- nose -->
    <path d="M48 47.5c-.7 2.2-1 4-.6 5.2.4.8 1.2 1.2 2.2 1.1" stroke="#d49d87" stroke-width="1.45" stroke-linecap="round" fill="none"/>

    <!-- smile -->
    <path d="M41.5 57.2c2 2.4 4.2 3.5 6.5 3.5s4.5-1.1 6.5-3.5" stroke="#b96f6d" stroke-width="2.15" stroke-linecap="round" fill="none"/>
    <path d="M44.1 57.5c2.7 1 5.1 1 7.8 0" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity=".85"/>

    <!-- cheeks -->
    <ellipse cx="35.7" cy="52.8" rx="3.6" ry="2.2" fill="#efa99f" opacity=".42"/>
    <ellipse cx="60.3" cy="52.8" rx="3.6" ry="2.2" fill="#efa99f" opacity=".42"/>

    <!-- small earrings -->
    <circle cx="30.5" cy="51.2" r="1.4" fill="#f4cc57"/>
    <circle cx="65.5" cy="51.2" r="1.4" fill="#f4cc57"/>
  </g>
</svg>
