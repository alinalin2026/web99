<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Sarah, the Web99 assistant">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f55ee"/>
      <stop offset="1" stop-color="#4429c7"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="48" cy="48" r="48"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <circle cx="48" cy="48" r="48" fill="url(#sky)"/>

    <!-- soft light behind the shoulders -->
    <circle cx="48" cy="86" r="42" fill="#8b6cff" opacity=".55"/>

    <!-- shoulders -->
    <path d="M12 96c0-19.9 16.1-33 36-33s36 13.1 36 33z" fill="#efebfe"/>
    <path d="M36 66c3.6 4.6 8 7 12 7s8.4-2.4 12-7l-4-4H40z" fill="#ded5fb"/>

    <!-- hair, back -->
    <path d="M25 44c0-14.4 10.3-25 23-25s23 10.6 23 25c0 8-1.4 15.3-4 21 1.6-9 1.2-16.6-1-22-3.9 3.4-10.2 5-18 5s-14.1-1.6-18-5c-2.2 5.4-2.6 13-1 22-2.6-5.7-4-13-4-21z" fill="#241a5c"/>

    <!-- face -->
    <path d="M31 41c0-10.5 7.6-18 17-18s17 7.5 17 18v8c0 10.5-7.6 19-17 19s-17-8.5-17-19z" fill="#f6e0d2"/>

    <!-- fringe -->
    <path d="M28 43c-.6-13.2 8.4-22 20-22s20.6 8.8 20 22c-2-7-6.4-11.4-13-13 .8 2.6.4 5-1 7-4.2-4.8-9.6-7-16-6.6-6 .4-9.4 4.6-10 12.6z" fill="#2d1f6e"/>

    <!-- eyes -->
    <circle cx="41" cy="45" r="2.4" fill="#241a5c"/>
    <circle cx="55" cy="45" r="2.4" fill="#241a5c"/>
    <circle cx="41.9" cy="44.2" r=".8" fill="#fff"/>
    <circle cx="55.9" cy="44.2" r=".8" fill="#fff"/>

    <!-- brows -->
    <path d="M37.5 40.2c1.8-1.4 4.2-1.6 6.2-.6M52.3 39.6c2-1 4.4-.8 6.2.6" stroke="#241a5c" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- smile -->
    <path d="M42 54.5c1.8 2.2 4 3.3 6 3.3s4.2-1.1 6-3.3" stroke="#c98f78" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- cheeks -->
    <ellipse cx="36.5" cy="50.5" rx="3.2" ry="2.1" fill="#efb9a4" opacity=".55"/>
    <ellipse cx="59.5" cy="50.5" rx="3.2" ry="2.1" fill="#efb9a4" opacity=".55"/>
  </g>
</svg>
