# Web99 — one server, one public front door, one live directory.

server {
    listen 80;
    listen [::]:80;
    server_name web99.ie www.web99.ie;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://web99.ie$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name web99.ie www.web99.ie;

    ssl_certificate /etc/letsencrypt/live/web99.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web99.ie/privkey.pem;

    root /srv/web99/live;
    index index.html;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /control {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /api/ops-agent {
        proxy_pass http://127.0.0.1:3000/control/api/ops-agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000/control/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location ^~ /demo/ {
        proxy_pass http://127.0.0.1:3000/control/demo/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /buy/ {
        proxy_pass http://127.0.0.1:3000/control/buy/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /choose/ {
        proxy_pass http://127.0.0.1:3000/control/choose/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /ops-console/ {
        try_files $uri $uri/ $uri/index.html =404;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }

    # Never expose operational source files from the live directory.
    location ^~ /dashboard/ { return 404; }
    location ^~ /ops/ { return 404; }
    location = /README.md { return 404; }
    location = /DEPLOY_TRIGGER { return 404; }
    location ~* \.(?:ts|tsx|mjs|lock|md|ya?ml)$ { return 404; }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Marketing site, /start and /ops-console are files from this same live tree.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~ /\. {
        deny all;
    }
}
