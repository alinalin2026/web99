# Web99 — single front door. Installed as /etc/nginx/sites-available/web99

server {
    listen 80;
    listen [::]:80;
    server_name web99.ie www.web99.ie;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://web99.ie$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name web99.ie www.web99.ie;

    ssl_certificate /etc/letsencrypt/live/web99.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web99.ie/privkey.pem;

    root /srv/web99/current;
    index index.html;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Operator UI and its Next.js assets. Preserve /control exactly because the
    # app has basePath=/control.
    location ^~ /control {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Public aliases into the same Next app. Long AI work is never supposed to
    # live in these requests; it is queued to PostgreSQL and handled by worker.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000/control/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Customer demos are served directly from the generated files stored in
    # PostgreSQL. No GitHub/Vercel publishing step is involved.
    location ^~ /demo/ {
        proxy_pass http://127.0.0.1:3000/control/demo/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /buy/ {
        proxy_pass http://127.0.0.1:3000/control/buy/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /choose/ {
        proxy_pass http://127.0.0.1:3000/control/choose/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # During the first production phase prefer correctness over aggressive
    # caching. This prevents a changed avatar/logo from becoming a cache chase.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Marketing site + /start are static files from THE SAME release as the
    # dashboard. There is no duplicate /srv/web99/marketing copy.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~ /\. {
        deny all;
    }
}
