# Web99 — single front door. Installed as /etc/nginx/sites-available/web99

server {
    listen 80;
    listen [::]:80;
    server_name web99.ie www.web99.ie;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://web99.ie$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name web99.ie www.web99.ie;

    ssl_certificate /etc/letsencrypt/live/web99.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web99.ie/privkey.pem;

    root /srv/web99/current;
    index index.html;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Operator UI and all of its basePath-prefixed Next assets.
    location ^~ /control {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # The private Ops Agent can make several diagnostic tool calls in one turn,
    # so give this one authenticated endpoint a little more room than ordinary
    # public API requests.
    location = /api/ops-agent {
        proxy_pass http://127.0.0.1:3000/control/api/ops-agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Public aliases into the same Next app. Long AI website work is queued to
    # PostgreSQL and handled by the worker rather than held in browser requests.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000/control/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location ^~ /demo/ {
        proxy_pass http://127.0.0.1:3000/control/demo/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /buy/ {
        proxy_pass http://127.0.0.1:3000/control/buy/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /choose/ {
        proxy_pass http://127.0.0.1:3000/control/choose/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hidden mobile operator console. The HTML contains no credential; the API
    # requires the same operator bearer secret as Control. Never cache the page.
    location ^~ /ops-console/ {
        try_files $uri $uri/ $uri/index.html =404;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
    }

    # The release contains application source beside the static marketing site.
    # These paths are operational source, never public content.
    location ^~ /dashboard/ { return 404; }
    location ^~ /ops/ { return 404; }
    location = /README.md { return 404; }
    location = /DEPLOY_TRIGGER { return 404; }
    location ~* \.(?:ts|tsx|mjs|lock|md|ya?ml)$ { return 404; }

    # Prefer correctness over aggressive caching during the first production
    # phase. A changed logo/avatar should become visible immediately.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Marketing site + /start are static files from the same immutable release.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~ /\. {
        deny all;
    }
}
